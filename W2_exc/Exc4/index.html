<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div class="header">
            <h1>Sign Up 
                <br> <span>Create your account</span>
            </h1>
        </div>
        <main>
            <div class="inputfield">
                <div class="tag">
                    <div class="text">
                        FUll Name
                    </div>
                    <div class="input">
                        <input type="text" placeholder="Enter your name" required>
                    </div>
                </div>
                <div class="tag">
                    <div class="text">
                        Email
                    </div>
                    <div class="input">
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="tag">
                    <div class="text">
                        Password
                    </div>
                    <div class="input">
                        <input type="text" placeholder="Enter your password" required>
                    </div>
                </div>
                <div class="tag">
                    <div class="text">
                        Confirm Password
                    </div>
                    <div class="input">
                        <input type="text" placeholder="Confirm your password" required>
                    </div>
                </div>
            </div>
            <button>Sign Up</button>
        </main>
    </form>
</body>
</html>
