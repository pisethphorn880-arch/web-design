<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        .container{
            display: flex; 
            justify-content: space-between; 
            padding-top: 100px; 
            color: white;
        }
        .box{
            width: 200px; 
            height: 200px;
        }
        .box1{
            background-color: red; padding: 50px; border: 10px solid black; text-align: center; align-content: center;
        }
        .box2{
            background-color: yellow; 
            padding: 50px; 
            border-width: 20px 10px 20px 10px; 
            border-style: solid; 
            border-color: black;
        }
        .content{
            width: 100%; 
            height: 100%;
            background-color: brown; 
            align-content: center; 
            text-align: center;
        }
        .box3{
            background-color: green; 
            border: 10px solid black; 
            text-align: center; 
            align-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">
            <h1>Div 1</h1>
        </div>
        <div class="box box2">
            <div class="content"><h1>Div 2</h1></div>
        </div>
        <div class="box box3">
            <h1>Div 3</h1>
        </div>
    </div>
</body>
</html>
